# 文章ルールチェッカーの設定
# このファイルを編集すると、コード変更なしにチェック条件を変えられる

teki_overuse:
  # writing-style.mdの原意「1段落に複数回は避ける」に基づく段落単位の上限
  per_paragraph_limit: 2
  # 引用（「…」内）は文体対象外として数えない
  exclude_quoted: true
  # 置換不能な固定語は数えない
  exceptions:
    - 目的
    - 標的
    - 的中
    - 法的
    - 性的
    - 公的
    - 私的

forbidden_phrases:
  list:
    - しましょう
    - してください

bracket_overuse:
  # 強調カッコ（中身が短い「…」）のみ段落単位で数える。長い引用は正当な用法として除外
  per_paragraph_limit: 2
  emphasis_max_chars: 8

dramatic_expressions:
  list:
    - 圧倒的
    - 驚愕
    - 衝撃
    - 劇的
    - 鮮烈
    - 絶望的
    - 絶対的
